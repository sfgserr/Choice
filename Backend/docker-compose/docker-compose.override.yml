services:
  nginx:
    ports:
      - 8080:80
    environment:
      - LISTEN_PORT=80
      - HOST_NAME=127.0.0.1
      - MINIO_HOST_NAME=192.168.0.108 192.168.0.107
      - SSL_DIRECTIVES=
  
  db:
    image: postgres
    container_name: "db"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pgadminchoice
      POSTGRES_DB: Choice
    ports:
      - 5432:5432
    
  webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgreSqlSettings__ConnectionString=User Id=root;Password=pgadminchoice;Host=db;Port=5432;Database=Choice;
      - IdentitySettings__Issuer=http://127.0.0.1:8080
    depends_on:
      - db
  
  minio:
    environment:
      - MINIO_ROOT_USER=ROOTNAME
      - MINIO_ROOT_PASSWORD=CHANGEME123
