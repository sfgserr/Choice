services:
  nginx:
    ports:
      - 80:80
      - 443:443
    volumes:
      - ../nginx/certificate.pem:/certs/certificate.pem
      - ../nginx/private_key.pem:/private/private_key.pem
      - /var/www/certbot:/var/www/certbot
    env_file:
      - .env
    environment:
      - LISTEN_PORT=443 ssl
      - HOST_NAME=${HOST_NAME}
      - MINIO_HOST_NAME=${MINIO_HOST_NAME}
      - |
        SSL_DIRECTIVES=
        ssl_certificate /certs/certificate.pem;
        ssl_certificate_key /private/private_key.pem;

  webapi:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - IdentitySettings__PathToCert=/keys/signing.pfx
      - IdentitySettings__SecretKey=${SECRET_KEY}
      - IdentitySettings__CertificatePassword=${CERTIFICATE_PASSWORD}
      - IdentitySettings__Issuer=https://${HOST_NAME}
      - Clients__0__ClientId=${CLIENT_ID}
      - Clients__0__ClientSecret=${CLIENT_SECRET}
      - YandexGeocoder__ApiKey=${YANDEX_API_KEY}
      - PostgreSqlSettings__ConnectionString=${CONNECTION_STRING}
    volumes:
      - /etc/ssl/choice:/keys

  minio:
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}